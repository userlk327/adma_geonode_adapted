<!-- ===== Ask ADMA floating chat widget ===== -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  #askadma-fab { position: fixed; bottom: 24px; right: 24px; z-index: 1050; width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #d00000, #9d0208); color: #fff; border: none; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.25); display: flex; align-items: center; justify-content: center; font-size: 24px; transition: transform .15s ease; }
  #askadma-fab:hover { transform: scale(1.08); }
  #askadma-window { position: fixed; bottom: 96px; right: 24px; z-index: 1050; width: 400px; max-width: calc(100vw - 48px); height: 560px; max-height: calc(100vh - 140px); background: #fff; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.28); display: none; flex-direction: column; overflow: hidden; }
  #askadma-window.open { display: flex; animation: askadma-pop .18s ease; }
  @keyframes askadma-pop { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  #askadma-header { background: linear-gradient(135deg, #d00000, #9d0208); color: #fff; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }
  #askadma-header .title { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  #askadma-header .subtitle { font-size: 11px; opacity: .85; }
  #askadma-head-btns button { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; margin-left: 8px; }
  #askadma-messages { flex: 1; padding: 16px; overflow-y: auto; background: #f7f7f8; display: flex; flex-direction: column; gap: 10px; }
  .askadma-msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
  .askadma-msg.user { align-self: flex-end; background: #d00000; color: #fff; border-bottom-right-radius: 4px; }
  .askadma-msg.bot { align-self: flex-start; background: #fff; color: #222; border: 1px solid #e5e5e5; border-bottom-left-radius: 4px; }
  .askadma-msg.typing { color: #888; font-style: italic; }
  .askadma-chart { align-self: stretch; background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 10px; }
  #askadma-inputbar { padding: 12px; background: #fff; border-top: 1px solid #ececec; display: flex; gap: 8px; }
  #askadma-text { flex: 1; border: 1px solid #ddd; border-radius: 20px; padding: 9px 14px; font-size: 14px; outline: none; }
  #askadma-text:focus { border-color: #d00000; }
  #askadma-send { border: none; background: #d00000; color: #fff; border-radius: 20px; padding: 0 18px; font-size: 14px; cursor: pointer; }
  #askadma-send:disabled { opacity: .5; }
</style>

<button id="askadma-fab" title="Ask ADMA">&#129302;</button>
<div id="askadma-window">
  <div id="askadma-header">
    <div><div class="title">&#129302; Ask ADMA</div><div class="subtitle">AI assistant for your data</div></div>
    <div id="askadma-head-btns"><button id="askadma-clear" title="New chat">&#128465;</button><button id="askadma-close" title="Close">&times;</button></div>
  </div>
  <div id="askadma-messages"></div>
  <div id="askadma-inputbar">
    <input id="askadma-text" type="text" placeholder="Type your question..." />
    <button id="askadma-send">Send</button>
  </div>
</div>

<script>
(function () {
  const fab = document.getElementById('askadma-fab');
  const win = document.getElementById('askadma-window');
  const closeBtn = document.getElementById('askadma-close');
  const clearBtn = document.getElementById('askadma-clear');
  const msgs = document.getElementById('askadma-messages');
  const input = document.getElementById('askadma-text');
  const send = document.getElementById('askadma-send');
  const STORE = 'askadma_conversation';

  let conversation = [];
  try { conversation = JSON.parse(localStorage.getItem(STORE) || '[]'); } catch (e) { conversation = []; }

  function getCookie(name) {
    const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return v ? v.pop() : '';
  }
  function saveConv() { try { localStorage.setItem(STORE, JSON.stringify(conversation.slice(-24))); } catch (e) {} }

  function addMsgEl(text, cls) {
    const d = document.createElement('div');
    d.className = 'askadma-msg ' + cls;
    d.textContent = text;
    msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
    return d;
  }
  function addChart(action) {
    const wrap = document.createElement('div');
    wrap.className = 'askadma-chart';
    const canvas = document.createElement('canvas');
    wrap.appendChild(canvas); msgs.appendChild(wrap); msgs.scrollTop = msgs.scrollHeight;
    new Chart(canvas, {
      type: action.chart_type === 'pie' ? 'pie' : (action.chart_type === 'line' ? 'line' : 'bar'),
      data: { labels: action.labels, datasets: [{ label: action.y_label || '', data: action.values,
        backgroundColor: action.chart_type === 'pie' ? undefined : 'rgba(208,0,0,.6)',
        borderColor: '#d00000', borderWidth: 1 }] },
      options: { plugins: { title: { display: !!action.title, text: action.title } } }
    });
  }

  function renderAll() {
    msgs.innerHTML = '';
    if (conversation.length === 0) { addMsgEl('Hi! Ask me anything about your data in ADMA.', 'bot'); return; }
    conversation.forEach(m => addMsgEl(m.content, m.role === 'user' ? 'user' : 'bot'));
  }
  renderAll();

  fab.addEventListener('click', () => { win.classList.toggle('open'); input.focus(); });
  closeBtn.addEventListener('click', () => win.classList.remove('open'));
  clearBtn.addEventListener('click', () => { conversation = []; saveConv(); renderAll(); });

  async function ask() {
    const q = input.value.trim();
    if (!q) return;
    conversation.push({ role: 'user', content: q });
    addMsgEl(q, 'user'); saveConv();
    input.value = ''; send.disabled = true;
    const typing = addMsgEl('Thinking...', 'bot typing');
    try {
      const resp = await fetch('/api/askadma/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
        body: JSON.stringify({ messages: conversation.slice(-12), current_url: window.location.pathname })
      });
      const data = await resp.json();
      typing.remove();
      const answer = data.answer || ('Error: ' + (data.error || 'no answer'));
      conversation.push({ role: 'assistant', content: answer });
      addMsgEl(answer, 'bot'); saveConv();
      if (data.action) {
        if (data.action.type === 'render_chart') { addChart(data.action); }
        else if (data.action.type === 'navigate' && data.action.url) {
          setTimeout(() => { window.location.href = data.action.url; }, 900);
        }
      }
    } catch (e) {
      typing.remove(); addMsgEl('Request failed: ' + e, 'bot');
    } finally { send.disabled = false; input.focus(); }
  }
  send.addEventListener('click', ask);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });

  // Auto-open after a navigation if a conversation exists (so chat persists across pages)
  if (conversation.length > 0) { /* stays available via FAB; history already loaded */ }
})();
</script>
<!-- ===== end Ask ADMA widget ===== -->
