{% load askadma_assets %}
<!-- ===== Ask ADMA side panel ===== -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<button id="askadma-fab" type="button" title="Ask ADMA" aria-label="Open Ask ADMA"><i class="fas fa-robot"></i></button>
<aside id="askadma-panel" aria-label="Ask ADMA" hidden>
  <div id="askadma-resize" title="Drag to resize"></div>
  <div id="askadma-header">
    <div><div class="askadma-title">Ask ADMA</div><div class="askadma-sub">Search, look at and analyze your data</div>
      <div id="askadma-swanbar" class="askadma-swanbar" hidden></div></div>
    <div class="askadma-head-btns">
      <button id="askadma-runs" type="button" title="My runs" aria-label="My runs"><i class="fas fa-tasks"></i></button>
      <button id="askadma-clear" type="button" title="New conversation" aria-label="New conversation"><i class="fas fa-plus"></i></button>
      <button id="askadma-close" type="button" title="Close panel" aria-label="Close panel"><i class="fas fa-times"></i></button>
    </div>
  </div>
  <div id="askadma-messages" aria-live="polite"></div>
  <form id="askadma-inputbar">
    <textarea id="askadma-text" rows="1" placeholder="Ask about your files, photos or data" aria-label="Message"></textarea>
    <button id="askadma-send" type="submit">Send</button>
  </form>
</aside>
<div id="askadma-viewer" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
  <div class="askadma-vbar">
    <span class="askadma-vname"></span><span class="askadma-vinfo"></span>
    <a class="askadma-vopen" href="#">Open file page</a>
    <button type="button" class="askadma-vclose" aria-label="Close viewer"><i class="fas fa-times"></i></button>
  </div>
  <div class="askadma-vstage">
    <button type="button" class="askadma-nav askadma-prev" aria-label="Previous photo"><i class="fas fa-chevron-left"></i></button>
    <div class="askadma-vimg" style="flex:1;min-width:0;height:100%;display:flex;align-items:center;justify-content:center"></div>
    <button type="button" class="askadma-nav askadma-next" aria-label="Next photo"><i class="fas fa-chevron-right"></i></button>
  </div>
</div>

<script src="{% askadma_asset 'askadma/widget.js' %}"></script>
<!-- ===== end Ask ADMA side panel ===== -->
