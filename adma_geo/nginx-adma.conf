events {
    worker_connections 1024;
}

http {
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=geoserver:10m rate=50r/s;  # More lenient for GeoServer
    
    upstream django {
        server django:8000;
    }

    server {
        listen 80;
        server_name localhost adma.unl.edu;

        client_max_body_size 500M;

        # Django and GeoServer get the Host the browser sent ($http_host), port
        # included: $host drops the port, so a sign-in at http://127.0.0.1:8024
        # failed Django's CSRF Origin check, and the WMS URLs Django and
        # GeoServer write into pages and capabilities pointed at port 80.

        # Security headers for HTTPS/HTTP compatibility
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        location /static/ {
            alias /var/www/static/;
        }

        location /media/ {
            alias /var/www/media/;
        }

        # GeoServer WMS proxy
        location /wms {
            proxy_pass http://geoserver:8080/geoserver/adma_geo/wms;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # --- Phase 1 hardening: GeoServer control plane is not public ---
        # Admin console and REST API must never be reachable from the tunnel.
        # Django reaches GeoServer over the internal Docker network instead.
        # On-host admin: http://127.0.0.1:8080/geoserver/web/ during an RDP session.
        location ^~ /geoserver/web {
            deny all;
            return 403;
        }

        location ^~ /geoserver/rest {
            deny all;
            return 403;
        }

        location ^~ /geoserver/j_spring_security_check {
            deny all;
            return 403;
        }

        # GeoServer REST API proxy with rate limiting
        location /geoserver/ {
            # Apply lenient rate limiting for GeoServer (allow bursts for tile loading)
            limit_req zone=geoserver burst=20 nodelay;
            
            proxy_pass http://geoserver:8080/geoserver/;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Handle index.html specifically (from Apache)
        location = /index.html {
            proxy_pass http://django/;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Handle index.htm as well (in case)
        location = /index.htm {
            proxy_pass http://django/;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Handle all other requests with general rate limiting
        location / {
            # Apply general rate limiting for Django requests
            limit_req zone=general burst=10 nodelay;
            
            proxy_pass http://django;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }
}
